<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce2b6" />
      <stop offset="35%" stop-color="#e3943f" />
      <stop offset="100%" stop-color="#b66a1a" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f1f" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury dark rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#gold-grad)" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Architectural Luxury Monogram "UG" / Diamond crest -->
  <g filter="url(#glow)">
    <!-- Outer geometric diamond frame -->
    <path d="M32 10 L50 20 L50 44 L32 54 L14 44 L14 20 Z" stroke="url(#gold-grad)" stroke-width="2.4" stroke-linejoin="round" fill="none" />

    <!-- Stylized "U" and "G" architectural interlocking elements -->
    <path d="M23 22 L23 35 C23 40.5 27 43.5 32 43.5 C37 40.5 41 35 41 22" stroke="url(#gold-grad)" stroke-width="2.8" stroke-linecap="round" fill="none" />
    <path d="M41 33 L32 33" stroke="url(#gold-grad)" stroke-width="2.6" stroke-linecap="round" />

    <!-- Central luxury spark -->
    <circle cx="32" cy="24" r="2.2" fill="url(#gold-grad)" />
  </g>
</svg>